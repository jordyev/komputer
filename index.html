<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventario Komputer Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                750: '#2d3748',
                850: '#1a202c',
                950: '#0f172a',
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      
      /* Print Styles */
      @media print {
        body {
          visibility: hidden;
          background-color: white !important;
          color: black !important;
        }
        
        /* Hide scrollbars during print */
        ::-webkit-scrollbar {
            display: none;
        }

        /* Make the printable modal visible and position it */
        .printable-content {
          visibility: visible;
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 20px;
          background: white !important;
          border: none !important;
          box-shadow: none !important;
          z-index: 9999;
        }
        
        .printable-content * {
          visibility: visible;
          color: black !important; /* Force black text for better printing */
        }

        /* Force specific print layout fixes */
        .print-layout-col {
           flex-direction: column !important;
           display: flex !important;
        }
        
        .print-image-size {
            max-height: 400px !important;
            width: auto !important;
            margin: 0 auto !important;
        }
        
        .print-full-width {
            width: 100% !important;
        }

        /* Hide UI elements marked as no-print */
        .no-print, .no-print * {
          display: none !important;
        }
      }
    </style>

}
